<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1c1c1e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Gasolineras">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Gasolineras</title>
<link rel="icon" type="image/png" sizes="180x180" href="/apple-touch-icon.png">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<style>
:root {
  color-scheme: dark;
  --text: #f5f5f7;
  --muted: rgba(235, 235, 245, 0.6);
  --blue: #0a84ff;
  --green: #30d158;
  --red: #ff453a;
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", system-ui, sans-serif;
  /* Altura real de la pantalla; la calcula el script (en iPhone puede ser mayor que 100%) */
  --app-h: 100%;
  /* Separación extra bajo la barra de estado en la app de inicio de iPhone (ver script) */
  --top-extra: 0px;
}
* { box-sizing: border-box; }

/* La página no se desplaza nunca: todo va colocado sobre el mapa */
html, body {
  margin: 0;
  overflow: hidden;
  overscroll-behavior: none;
  background: #1c1c1e;
}
html { height: var(--app-h); }
body {
  position: relative;
  height: var(--app-h);
  font-family: var(--font);
  color: var(--text);
  -webkit-font-smoothing: antialiased;
}
button, select { font: inherit; color: inherit; }
.hidden { display: none !important; }

/* Todo se coloca con position: absolute sobre el body, que mide lo mismo que la pantalla.
   Con position: fixed, iOS recorta los elementos a una zona más baja que la pantalla
   en las apps de inicio, y eso dejaba la franja de abajo. */
#map {
  position: absolute;
  inset: 0;
}

/* "Liquid glass": cristal translúcido con brillo en los bordes */
.glass {
  background:
    linear-gradient(135deg, rgba(255, 255, 255, 0.10), rgba(255, 255, 255, 0.03)),
    rgba(24, 24, 28, 0.82);
  border: 1px solid rgba(255, 255, 255, 0.16);
  box-shadow:
    inset 0 1px 0 rgba(255, 255, 255, 0.25),
    inset 0 -1px 0 rgba(255, 255, 255, 0.05),
    0 12px 40px rgba(0, 0, 0, 0.45);
  border-radius: 26px;
}

/* Bloque superior: cabecera, selectores y precios.
   En la app de inicio de iPhone baja lo justo para quedar fuera del desenfoque
   que iOS pone bajo la barra de estado (el mapa sí sigue llegando hasta arriba). */
.top {
  position: absolute;
  top: calc(env(safe-area-inset-top, 0px) + 12px + var(--top-extra));
  left: 12px;
  right: 12px;
  z-index: 5;
  display: flex;
  flex-direction: column;
  gap: 8px;
  pointer-events: none;
}
.top > * { pointer-events: auto; }

.header {
  padding: 10px 14px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  touch-action: none;
}
.count { font-weight: 700; font-size: 16px; letter-spacing: -0.2px; white-space: nowrap; }
.meta { text-align: right; min-width: 0; }
.status { font-size: 12px; color: var(--muted); white-space: nowrap; }
.credit { font-size: 10px; color: rgba(235, 235, 245, 0.4); white-space: nowrap; }

.controls {
  display: flex;
  gap: 8px;
  padding: 6px;
  border-radius: 999px;
  touch-action: none;
}
.ctl {
  flex: 1 1 0;
  min-width: 0;
  height: 40px;
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 0 10px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.1);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.18);
}
.ctl .icon { flex: 0 0 auto; display: flex; align-items: center; font-size: 16px; }
.ctl select {
  flex: 1 1 auto;
  min-width: 0;
  background: transparent;
  border: 0;
  outline: none;
  padding: 0;
  font-size: 14px;
  font-weight: 600;
  text-align: center;
  text-align-last: center;
  -webkit-appearance: none;
  appearance: none;
  cursor: pointer;
  text-overflow: ellipsis;
}
.ctl select option { color: #000; }
.ctl .caret { flex: 0 0 auto; font-size: 10px; color: var(--muted); }

.extremes {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 6px;
  padding: 6px;
  border-radius: 22px;
  touch-action: none;
}
.extreme {
  border: 0;
  background: rgba(255, 255, 255, 0.06);
  color: var(--text);
  text-align: left;
  padding: 8px 10px;
  border-radius: 16px;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  gap: 2px;
  min-width: 0;
}
.extreme .v { font-size: 17px; font-weight: 700; font-variant-numeric: tabular-nums; }
.extreme.cheap .v { color: var(--green); }
.extreme.exp .v { color: var(--red); }
.extreme .s { font-size: 11px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* Precio: dos decimales grandes y el tercero pequeño arriba, como en las gasolineras */
sup { font-size: 0.6em; vertical-align: top; line-height: 1; margin-left: 1px; }

.notice {
  align-self: center;
  padding: 6px 14px;
  font-size: 12px;
  color: var(--text);
  border-radius: 999px;
}

/* Lista de gasolineras: solo visible en escritorio */
.list {
  display: none;
  flex-direction: column;
  gap: 4px;
  flex: 1 1 auto;
  min-height: 0;
  overflow-y: auto;
  padding: 6px;
  border-radius: 22px;
}
.row-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  border: 0;
  background: rgba(255, 255, 255, 0.05);
  color: var(--text);
  padding: 9px 10px;
  border-radius: 14px;
  cursor: pointer;
  text-align: left;
}
.row-item:hover { background: rgba(255, 255, 255, 0.1); }
.row-price { font-size: 16px; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
.row-info { display: flex; flex-direction: column; min-width: 0; text-align: right; }
.row-name { font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row-dist { font-size: 11px; color: var(--muted); }

.pill {
  position: absolute;
  left: 50%;
  bottom: calc(env(safe-area-inset-bottom, 0px) + 20px);
  transform: translateX(-50%);
  z-index: 6;
  padding: 13px 22px;
  border-radius: 999px;
  color: #fff;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  white-space: nowrap;
  background: rgba(10, 132, 255, 0.92);
  border: 1px solid rgba(255, 255, 255, 0.25);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.4), 0 12px 30px rgba(0, 0, 0, 0.4);
  touch-action: none;
}

.round {
  position: absolute;
  left: 16px;
  bottom: calc(env(safe-area-inset-bottom, 0px) + 20px);
  z-index: 6;
  width: 48px;
  height: 48px;
  border-radius: 50%;
  font-size: 20px;
  color: #fff;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0;
  touch-action: none;
}

/* Cada pin va dentro de un contenedor que MapLibre posiciona; no le ponemos transiciones */
.pin-wrap { width: auto; height: auto; }
.pin {
  border: 1px solid rgba(255, 255, 255, 0.25);
  background: rgba(28, 28, 30, 0.82);
  color: #fff;
  border-radius: 999px;
  padding: 6px 10px;
  font-size: 12px;
  font-weight: 700;
  white-space: nowrap;
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.2), 0 4px 12px rgba(0, 0, 0, 0.4);
  cursor: pointer;
  font-variant-numeric: tabular-nums;
}
.pin.cheap { background: rgba(48, 209, 88, 0.92); border-color: rgba(255, 255, 255, 0.4); }
.pin.exp { background: rgba(255, 69, 58, 0.92); border-color: rgba(255, 255, 255, 0.4); }
/* Pulso para señalar la gasolinera al centrarla */
.pin.focus { animation: pulse 1.2s ease-out 3; }
@keyframes pulse {
  0% { box-shadow: 0 0 0 0 rgba(255, 255, 255, 0.75), 0 4px 12px rgba(0, 0, 0, 0.4); }
  100% { box-shadow: 0 0 0 16px rgba(255, 255, 255, 0), 0 4px 12px rgba(0, 0, 0, 0.4); }
}

.me {
  width: 16px;
  height: 16px;
  border-radius: 50%;
  background: var(--blue);
  border: 3px solid #fff;
  box-shadow: 0 0 0 6px rgba(10, 132, 255, 0.25);
}

.loader {
  position: absolute;
  inset: 0;
  z-index: 20;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(0, 0, 0, 0.35);
  touch-action: none;
}
.loader-card {
  padding: 22px 26px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
  font-size: 14px;
  font-weight: 500;
  text-align: center;
}
.spinner {
  width: 28px;
  height: 28px;
  border: 3px solid rgba(255, 255, 255, 0.2);
  border-top-color: var(--blue);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.retry {
  border: 0;
  background: var(--blue);
  color: #fff;
  padding: 9px 18px;
  border-radius: 999px;
  font-weight: 600;
  cursor: pointer;
}

.modal {
  position: absolute;
  inset: 0;
  z-index: 30;
  background: rgba(0, 0, 0, 0.45);
  display: flex;
  align-items: flex-end;
  justify-content: center;
  padding: 12px;
  padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 12px);
  touch-action: none;
}
.sheet {
  background: rgba(28, 28, 30, 0.96);
  width: 100%;
  max-width: 480px;
  max-height: 82%;
  overflow-y: auto;
  border-radius: 28px;
  padding: 20px;
  border: 1px solid rgba(255, 255, 255, 0.12);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.2);
  touch-action: pan-y;
}
.sheet-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
.sheet-title { font-size: 19px; font-weight: 700; margin: 0; }
.sheet-sub { font-size: 13px; color: var(--muted); margin-top: 4px; }
.close {
  border: 0;
  background: rgba(255, 255, 255, 0.12);
  width: 32px;
  height: 32px;
  border-radius: 50%;
  font-size: 18px;
  line-height: 1;
  cursor: pointer;
  color: var(--muted);
  flex: 0 0 auto;
}
.info {
  margin: 16px 0 12px;
  padding: 13px 14px;
  background: rgba(255, 255, 255, 0.07);
  border-radius: 16px;
  font-size: 13px;
  display: flex;
  justify-content: space-between;
  gap: 12px;
}
.info .label { color: var(--muted); }
#modalSchedule { font-weight: 600; text-align: right; }
#modalSchedule.open { color: var(--green); }
#modalSchedule.closed { color: var(--red); }
.prices-title {
  font-size: 12px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  color: var(--muted);
  margin: 14px 0 8px;
}
.prices { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.price {
  border-radius: 14px;
  padding: 11px 12px;
  background: rgba(255, 255, 255, 0.07);
  font-size: 13px;
  display: flex;
  flex-direction: column;
  gap: 4px;
  color: var(--muted);
}
.price b { font-size: 16px; color: var(--text); font-variant-numeric: tabular-nums; }
.price.selected { background: rgba(10, 132, 255, 0.22); }
.links { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 18px; }
.links a {
  text-align: center;
  text-decoration: none;
  padding: 13px;
  border-radius: 16px;
  font-size: 14px;
  font-weight: 600;
}
.links a.google { background: #ffffff; color: #1c1c1e; }
.links a.apple { background: var(--blue); color: #fff; }

/* Escritorio: panel a la izquierda con la lista y el mapa a pantalla completa */
@media (min-width: 900px) {
  .top { top: 12px; left: 12px; right: auto; bottom: 12px; width: 380px; }
  .list { display: flex; }
  .round { left: 404px; }
  .pill { left: calc(50% + 196px); }
  .modal { align-items: center; }
}
</style>
</head>
<body>

<div id="map"></div>

<div class="top">
  <div class="glass header">
    <div class="count" id="count">Gasolineras</div>
    <div class="meta">
      <div class="status" id="status">Cargando…</div>
      <div class="credit">© OpenStreetMap · © CARTO</div>
    </div>
  </div>

  <div class="glass controls">
    <label class="ctl">
      <span class="icon" aria-hidden="true">
        <svg width="16" height="16" viewBox="0 0 24 24"><path fill="#ff453a" d="M12 2.5C9 6.6 6 10.2 6 14a6 6 0 0 0 12 0c0-3.8-3-7.4-6-11.5z"/></svg>
      </span>
      <select id="fuelSelect" aria-label="Combustible"></select>
      <span class="caret" aria-hidden="true">▼</span>
    </label>
    <label class="ctl">
      <span class="icon" aria-hidden="true">⛽</span>
      <select id="brandSelect" aria-label="Marca"></select>
      <span class="caret" aria-hidden="true">▼</span>
    </label>
  </div>

  <div class="glass extremes hidden" id="extremes">
    <button class="extreme cheap" id="cheapBtn" type="button">
      <span class="v" id="cheapPrice"></span>
      <span class="s" id="cheapInfo"></span>
    </button>
    <button class="extreme exp" id="expBtn" type="button">
      <span class="v" id="expPrice"></span>
      <span class="s" id="expInfo"></span>
    </button>
  </div>

  <div class="glass notice hidden" id="notice"></div>
  <div class="glass list" id="list"></div>
</div>

<button id="searchArea" class="pill hidden" type="button">Buscar en esta zona</button>
<button id="locate" class="glass round" type="button" aria-label="Centrar en mi ubicación">◎</button>

<div id="loader" class="loader">
  <div class="glass loader-card">
    <div class="spinner" id="spinner"></div>
    <div id="loaderText">Cargando gasolineras…</div>
    <button id="retry" class="retry hidden" type="button">Reintentar</button>
  </div>
</div>

<div id="modal" class="modal hidden">
  <div class="sheet" role="dialog" aria-modal="true">
    <div class="sheet-head">
      <div>
        <h2 class="sheet-title" id="modalTitle"></h2>
        <div class="sheet-sub" id="modalAddress"></div>
      </div>
      <button class="close" id="modalClose" type="button" aria-label="Cerrar">×</button>
    </div>
    <div class="info">
      <span class="label">Horario</span>
      <span id="modalSchedule"></span>
    </div>
    <div class="prices-title">Precios</div>
    <div class="prices" id="modalPrices"></div>
    <div class="links">
      <a id="btnGoogle" class="google" href="#" target="_blank" rel="noopener">Google Maps</a>
      <a id="btnApple" class="apple" href="#" target="_blank" rel="noopener">Apple Maps</a>
    </div>
  </div>
</div>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script>
const API_URL = "/api/gasolineras";
const MAP_STYLE = "https://basemaps.cartocdn.com/gl/dark-matter-gl-style/style.json";
const RADIUS_KM = 15;
const MAX_PINS = 300;
const DEFAULT_CENTER = { lat: 40.4168, lng: -3.7038 }; // Madrid
// Alto del desenfoque que iOS 26 pone bajo la barra de estado en las apps de inicio
const IOS_EDGE_BLUR = 56;

const FUEL_NAMES = {
  gasolina95: "Gasolina 95 E5",
  gasolina98: "Gasolina 98 E5",
  gasoleoA: "Gasóleo A",
  gasoleoPremium: "Gasóleo Premium",
  glp: "GLP",
  gnc: "GNC"
};

// Marcas que se muestran por separado. Todo lo que no encaje cae en "Otros".
const BRAND_RULES = [
  ["Repsol", ["REPSOL"]],
  ["Moeve / Cepsa", ["MOEVE", "CEPSA", "CAMPSA"]],
  ["Shell", ["SHELL"]],
  ["BP", ["BP"]],
  ["Galp", ["GALP"]],
  ["Ballenoil", ["BALLENOIL"]],
  ["Plenergy", ["PLENERGY"]],
  ["Petronor", ["PETRONOR"]],
  ["Carrefour", ["CARREFOUR"]],
  ["Avia", ["AVIA"]],
  ["Q8", ["Q8"]],
  ["Alcampo", ["ALCAMPO"]],
  ["Eroski", ["EROSKI"]],
  ["E.Leclerc", ["E.LECLERC", "LECLERC"]],
  ["Tamoil", ["TAMOIL"]],
  ["Disa", ["DISA"]],
  ["Naturgy", ["NATURGY"]]
];
const OTHERS = "Otros";

const DAY_IDX = { L: 0, M: 1, X: 2, J: 3, V: 4, S: 5, D: 6 };
const DAY_NAMES = ["lunes", "martes", "miércoles", "jueves", "viernes", "sábado", "domingo"];

const $ = (id) => document.getElementById(id);

// ---------- Tamaño de pantalla ----------

// En la app de inicio de iPhone (con la barra de estado translúcida), iOS dice que la
// pantalla mide la altura real menos la barra de estado, pero dibuja la página desde arriba
// del todo. Por eso quedaba una franja abajo. Aquí medimos la altura real y se la damos
// al body, y además bajamos el bloque superior fuera del desenfoque de la barra de estado.
function safeAreaTop() {
  const probe = document.createElement("div");
  probe.style.cssText = "position:absolute;top:0;left:0;width:1px;height:env(safe-area-inset-top,0px);visibility:hidden;pointer-events:none";
  document.body.appendChild(probe);
  const value = probe.offsetHeight;
  probe.remove();
  return value;
}

function fitViewport() {
  const ios = /iPhone|iPad|iPod/.test(navigator.userAgent) ||
    (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  const standalone = window.navigator.standalone === true ||
    window.matchMedia("(display-mode: standalone)").matches;
  const iosHomeApp = ios && standalone && safeAreaTop() > 0;

  let height = window.innerHeight;
  if (iosHomeApp) {
    const landscape = window.innerWidth > window.innerHeight;
    const screenHeight = landscape
      ? Math.min(screen.width, screen.height)
      : Math.max(screen.width, screen.height);
    height = Math.max(height, screenHeight);
  }

  const root = document.documentElement.style;
  root.setProperty("--app-h", height + "px");
  root.setProperty("--top-extra", iosHomeApp ? IOS_EDGE_BLUR + "px" : "0px");
  if (map) map.resize();
}

// Recordamos el último combustible elegido durante un año
function readFuelCookie() {
  try {
    const m = document.cookie.match(/(?:^|;\s*)fuel=([^;]+)/);
    return m && FUEL_NAMES[m[1]] ? m[1] : null;
  } catch (e) {
    return null;
  }
}

function saveFuelCookie() {
  try {
    document.cookie = `fuel=${fuel}; max-age=31536000; path=/; SameSite=Lax`;
  } catch (e) { /* sin cookies: no pasa nada */ }
}

let map = null;
let stations = [];       // estaciones con marca normalizada
let updatedAt = null;
let fuel = readFuelCookie() || "gasolina95";
let brandFilter = "ALL";
let userLoc = null;      // { lat, lng }
let view = { mode: "radius", center: null }; // "radius" o "bounds"
let markers = [];
let pinById = new Map(); // id de estación -> botón del pin
let userMarker = null;
let extremeStations = { cheap: null, exp: null };
let noticeTimer = null;

// ---------- Utilidades ----------

function distKm(lat1, lon1, lat2, lon2) {
  const R = 6371;
  const toRad = (d) => (d * Math.PI) / 180;
  const dLat = toRad(lat2 - lat1);
  const dLon = toRad(lon2 - lon1);
  const a = Math.sin(dLat / 2) ** 2 +
    Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLon / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(a));
}

// 1,09⁹ €: dos decimales grandes y el tercero pequeño arriba (sin redondear, para no engañar)
function priceHtml(p) {
  const s = p.toFixed(3);                          // "1.099"
  const main = s.slice(0, -1).replace(".", ",");   // "1,09"
  const last = s.slice(-1);                        // "9"
  return `${main}<sup>${last}</sup>&nbsp;€`;
}

function fmtPlain(p) {
  return p.toFixed(3).replace(".", ",") + " €";
}

function formatUpdated(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  const date = d.toLocaleDateString("es-ES", { day: "2-digit", month: "2-digit" });
  const time = d.toLocaleTimeString("es-ES", { hour: "2-digit", minute: "2-digit" });
  return `${date} · ${time}`;
}

function normalizeBrand(raw) {
  const t = (raw || "").trim().toUpperCase().replace(/\s+/g, " ");
  for (const [name, keys] of BRAND_RULES) {
    for (const k of keys) {
      if (t === k || t.startsWith(k + " ") || t.startsWith(k + "-") || t.startsWith(k + ".")) return name;
    }
  }
  return OTHERS;
}

function showNotice(text, ms = 4000) {
  const el = $("notice");
  el.textContent = text;
  el.classList.remove("hidden");
  clearTimeout(noticeTimer);
  if (ms) noticeTimer = setTimeout(() => el.classList.add("hidden"), ms);
}

function hideNotice() {
  clearTimeout(noticeTimer);
  $("notice").classList.add("hidden");
}

function isDesktop() {
  return window.matchMedia("(min-width: 900px)").matches;
}

// ---------- Horarios ----------

function hhmm(m) {
  return String(Math.floor(m / 60)).padStart(2, "0") + ":" + String(m % 60).padStart(2, "0");
}

function expandDays(str) {
  const set = new Set();
  for (const tok of str.split(",")) {
    const [a, b] = tok.split("-");
    const start = DAY_IDX[a];
    const end = b ? DAY_IDX[b] : start;
    for (let d = start; ; d = (d + 1) % 7) {
      set.add(d);
      if (d === end) break;
    }
  }
  return set;
}

function parseSchedule(h) {
  if (!h) return null;
  const segs = [];
  for (const part of h.split(";")) {
    const m = part.trim().match(/^([LMXJVSD](?:-[LMXJVSD])?(?:,[LMXJVSD](?:-[LMXJVSD])?)*)\s*:\s*(.+)$/);
    if (!m) return null;
    const days = expandDays(m[1]);
    const times = m[2].trim();
    if (/24\s*H/i.test(times)) { segs.push({ days, all: true }); continue; }
    const tm = times.match(/^(\d{1,2}):(\d{2})\s*-\s*(\d{1,2}):(\d{2})$/);
    if (!tm) return null;
    const start = Number(tm[1]) * 60 + Number(tm[2]);
    let end = Number(tm[3]) * 60 + Number(tm[4]);
    if (end === 0) end = 1440; // "hasta las 00:00" = medianoche
    segs.push({ days, start, end });
  }
  return segs;
}

// Hora actual en Madrid: día de la semana (0 = lunes) y minutos desde las 00:00
function madridNow() {
  const parts = new Intl.DateTimeFormat("en-GB", {
    timeZone: "Europe/Madrid", weekday: "short", hour: "2-digit", minute: "2-digit", hour12: false
  }).formatToParts(new Date());
  const get = (type) => parts.find((p) => p.type === type).value;
  const dow = { Mon: 0, Tue: 1, Wed: 2, Thu: 3, Fri: 4, Sat: 5, Sun: 6 }[get("weekday")];
  return { dow, min: (Number(get("hour")) % 24) * 60 + Number(get("minute")) };
}

function scheduleStatus(h) {
  const segs = parseSchedule(h);
  if (!segs) return { open: null, text: h || "Sin datos" };
  const now = madridNow();

  // ¿Está abierto ahora? Miramos hoy y también el turno de ayer que cruza la medianoche
  for (const off of [0, -1]) {
    const dow = (now.dow + off + 7) % 7;
    const t = now.min - off * 1440;
    for (const seg of segs) {
      if (!seg.days.has(dow)) continue;
      if (seg.all) return { open: true, text: "Abierto 24 horas" };
      let s = seg.start;
      let e = seg.end;
      if (e <= s) e += 1440;
      if (t >= s && t < e) return { open: true, text: `Abierto · cierra a las ${hhmm(e % 1440)}` };
    }
  }

  // Cerrado: buscamos el próximo turno de apertura
  for (let k = 0; k <= 7; k++) {
    const dow = (now.dow + k) % 7;
    let best = null;
    for (const seg of segs) {
      if (!seg.days.has(dow) || seg.all) continue;
      const abs = k * 1440 + seg.start;
      if (abs > now.min && (best === null || abs < best.abs)) best = { abs, start: seg.start };
    }
    if (best) {
      const when = k === 0 ? "hoy" : k === 1 ? "mañana" : "el " + DAY_NAMES[dow];
      return { open: false, text: `Cerrado · abre ${when} a las ${hhmm(best.start)}` };
    }
  }
  return { open: false, text: "Cerrado" };
}

// ---------- Selectores nativos de combustible y marca ----------

function buildFuelSelect() {
  const sel = $("fuelSelect");
  sel.innerHTML = "";
  Object.entries(FUEL_NAMES).forEach(([value, label]) => sel.add(new Option(label, value)));
  sel.value = fuel;
  sel.addEventListener("change", () => {
    fuel = sel.value;
    saveFuelCookie();
    refresh();
  });
}

function buildBrandSelect() {
  const sel = $("brandSelect");
  const present = new Set(stations.map((s) => s.marca));
  const names = BRAND_RULES.map(([name]) => name).concat(OTHERS);
  sel.innerHTML = "";
  sel.add(new Option("Todas las marcas", "ALL"));
  names.filter((n) => present.has(n)).forEach((n) => sel.add(new Option(n, n)));
  sel.value = brandFilter;
}

$("brandSelect").addEventListener("change", (e) => {
  brandFilter = e.target.value;
  refresh();
});

// ---------- Filtrado y pintado ----------

function candidates() {
  return stations.filter((s) =>
    s.precios[fuel] !== null && (brandFilter === "ALL" || s.marca === brandFilter)
  );
}

function stationsNear(center, km) {
  return candidates()
    .map((s) => ({ s, d: distKm(center.lat, center.lng, s.lat, s.lon) }))
    .filter((x) => x.d <= km)
    .sort((a, b) => a.d - b.d);
}

function stationsInView() {
  const bounds = map.getBounds();
  const c = map.getCenter();
  return candidates()
    .filter((s) => bounds.contains([s.lon, s.lat]))
    .map((s) => ({ s, d: distKm(c.lat, c.lng, s.lat, s.lon) }))
    .sort((a, b) => a.d - b.d);
}

function clearMarkers() {
  markers.forEach((m) => m.remove());
  markers = [];
  pinById = new Map();
}

function makePin(station, price, cls) {
  const wrap = document.createElement("div");
  wrap.className = "pin-wrap";
  const btn = document.createElement("button");
  btn.type = "button";
  btn.className = "pin " + cls;
  btn.innerHTML = priceHtml(price);
  btn.setAttribute("aria-label", `${station.marca}, ${fmtPlain(price)}`);
  btn.addEventListener("click", (e) => {
    e.stopPropagation();
    openModal(station);
  });
  wrap.appendChild(btn);
  pinById.set(station.id, btn);
  return wrap;
}

function renderExtremes(entries) {
  const box = $("extremes");
  if (!entries.length) {
    box.classList.add("hidden");
    extremeStations = { cheap: null, exp: null };
    return;
  }
  let cheap = entries[0].s;
  let exp = entries[0].s;
  entries.forEach(({ s }) => {
    if (s.precios[fuel] < cheap.precios[fuel]) cheap = s;
    if (s.precios[fuel] > exp.precios[fuel]) exp = s;
  });
  extremeStations = { cheap, exp };

  $("cheapPrice").innerHTML = priceHtml(cheap.precios[fuel]);
  $("cheapInfo").textContent = `Barata · ${cheap.marca} · ${cheap.municipio}`;
  $("expPrice").innerHTML = priceHtml(exp.precios[fuel]);
  $("expInfo").textContent = `Cara · ${exp.marca} · ${exp.municipio}`;
  box.classList.remove("hidden");
}

// Lista lateral (escritorio): las 80 más baratas de la zona
function renderList(entries) {
  const box = $("list");
  box.innerHTML = "";
  const sorted = entries.slice().sort((a, b) => a.s.precios[fuel] - b.s.precios[fuel]).slice(0, 80);
  if (!sorted.length) {
    const empty = document.createElement("div");
    empty.className = "row-dist";
    empty.style.padding = "10px";
    empty.textContent = "Sin estaciones en esta zona";
    box.appendChild(empty);
    return;
  }
  sorted.forEach(({ s, d }) => {
    const row = document.createElement("button");
    row.type = "button";
    row.className = "row-item";
    const price = document.createElement("span");
    price.className = "row-price";
    price.innerHTML = priceHtml(s.precios[fuel]);
    const info = document.createElement("span");
    info.className = "row-info";
    const name = document.createElement("span");
    name.className = "row-name";
    name.textContent = `${s.marca} · ${s.municipio}`;
    const dist = document.createElement("span");
    dist.className = "row-dist";
    dist.textContent = `${d.toFixed(1).replace(".", ",")} km`;
    info.append(name, dist);
    row.append(price, info);
    row.addEventListener("click", () => focusStation(s));
    box.appendChild(row);
  });
}

function renderEntries(entries) {
  clearMarkers();
  const prices = entries.map((x) => x.s.precios[fuel]);
  const min = prices.length ? Math.min(...prices) : null;
  const max = prices.length ? Math.max(...prices) : null;

  entries.slice(0, MAX_PINS).forEach(({ s }) => {
    const price = s.precios[fuel];
    let cls = "";
    if (price === min) cls = "cheap";
    else if (price === max && max !== min) cls = "exp";
    const el = makePin(s, price, cls);
    markers.push(
      new maplibregl.Marker({ element: el, anchor: "center" })
        .setLngLat([s.lon, s.lat])
        .addTo(map)
    );
  });

  renderExtremes(entries);
  renderList(entries);
  $("count").textContent = `Gasolineras: ${entries.length}`;
  $("status").textContent = updatedAt ? `Últ. act. ${formatUpdated(updatedAt)}` : "";
}

function refresh() {
  if (!stations.length || !map) return;
  let entries;
  if (view.mode === "radius" && view.center) {
    entries = stationsNear(view.center, RADIUS_KM);
    drawArea(circlePolygon(view.center.lat, view.center.lng, RADIUS_KM));
  } else {
    entries = stationsInView();
    drawArea(viewPolygon());
  }
  renderEntries(entries);
}

// Centra el mapa en una gasolinera.
// Móvil: en el centro exacto de la pantalla, con un pulso en su pin (al tocar el pin se abre el detalle).
// Escritorio: en el centro de la zona del mapa que no tapa el panel, y abre el detalle.
function focusStation(s) {
  if (!s) return;
  const desktop = isDesktop();
  map.flyTo({
    center: [s.lon, s.lat],
    zoom: Math.max(map.getZoom(), 14),
    offset: desktop ? [196, 0] : [0, 0]
  });
  const pin = pinById.get(s.id);
  if (pin) {
    pin.classList.remove("focus");
    void pin.offsetWidth; // reinicia la animación
    pin.classList.add("focus");
  }
  if (desktop) openModal(s);
}

// ---------- Área de búsqueda ----------

function circlePolygon(lat, lng, km, steps = 96) {
  const R = 6371;
  const d = km / R;
  const lat1 = (lat * Math.PI) / 180;
  const lon1 = (lng * Math.PI) / 180;
  const coords = [];
  for (let i = 0; i <= steps; i++) {
    const brng = (2 * Math.PI * i) / steps;
    const lat2 = Math.asin(Math.sin(lat1) * Math.cos(d) + Math.cos(lat1) * Math.sin(d) * Math.cos(brng));
    const lon2 = lon1 + Math.atan2(
      Math.sin(brng) * Math.sin(d) * Math.cos(lat1),
      Math.cos(d) - Math.sin(lat1) * Math.sin(lat2)
    );
    coords.push([(lon2 * 180) / Math.PI, (lat2 * 180) / Math.PI]);
  }
  return { type: "Feature", properties: {}, geometry: { type: "Polygon", coordinates: [coords] } };
}

function viewPolygon() {
  const b = map.getBounds();
  const w = b.getWest(), e = b.getEast(), s = b.getSouth(), n = b.getNorth();
  return {
    type: "Feature",
    properties: {},
    geometry: { type: "Polygon", coordinates: [[[w, s], [e, s], [e, n], [w, n], [w, s]]] }
  };
}

function drawArea(feature) {
  const src = map && map.getSource("area");
  if (!src) return;
  src.setData({ type: "FeatureCollection", features: feature ? [feature] : [] });
}

function addAreaLayers() {
  map.addSource("area", { type: "geojson", data: { type: "FeatureCollection", features: [] } });
  map.addLayer({
    id: "area-fill",
    type: "fill",
    source: "area",
    paint: { "fill-color": "#0a84ff", "fill-opacity": 0.08 }
  });
  map.addLayer({
    id: "area-line",
    type: "line",
    source: "area",
    paint: { "line-color": "#0a84ff", "line-width": 1.5, "line-opacity": 0.9, "line-dasharray": [2, 2] }
  });
}

// ---------- Ubicación ----------

function showUser(loc) {
  if (userMarker) userMarker.remove();
  const el = document.createElement("div");
  el.className = "pin-wrap";
  const dot = document.createElement("div");
  dot.className = "me";
  el.appendChild(dot);
  userMarker = new maplibregl.Marker({ element: el }).setLngLat([loc.lng, loc.lat]).addTo(map);
}

function goToUser(loc, zoom = 12) {
  userLoc = loc;
  view = { mode: "radius", center: loc };
  showUser(loc);
  $("searchArea").classList.add("hidden");
  map.flyTo({ center: [loc.lng, loc.lat], zoom });
  refresh();
}

function locate() {
  if (!navigator.geolocation) {
    showNotice("Tu navegador no permite la ubicación: mostrando Madrid");
    goToUser(DEFAULT_CENTER);
    return;
  }
  showNotice("Buscando tu ubicación…", 0);
  navigator.geolocation.getCurrentPosition(
    (pos) => {
      hideNotice();
      goToUser({ lat: pos.coords.latitude, lng: pos.coords.longitude });
    },
    () => {
      showNotice("Ubicación no disponible: mostrando Madrid");
      goToUser(DEFAULT_CENTER);
    },
    { enableHighAccuracy: true, timeout: 10000, maximumAge: 300000 }
  );
}

// ---------- Carga de datos ----------

function showLoader(text, isError = false) {
  $("loader").classList.remove("hidden");
  $("loaderText").textContent = text;
  $("spinner").classList.toggle("hidden", isError);
  $("retry").classList.toggle("hidden", !isError);
}

function hideLoader() {
  $("loader").classList.add("hidden");
}

async function loadData() {
  showLoader("Cargando gasolineras…");
  try {
    const res = await fetch(API_URL);
    if (!res.ok) throw new Error("HTTP " + res.status);
    const json = await res.json();
    stations = json.estaciones.map((s) => ({ ...s, marca: normalizeBrand(s.rotulo) }));
    updatedAt = json.fechaActualizacion;
    buildBrandSelect();
    hideLoader();
    refresh();
  } catch (err) {
    showLoader("No se pudieron cargar las gasolineras. Inténtalo de nuevo.", true);
  }
}

// ---------- Detalle ----------

function openModal(s) {
  $("modalTitle").textContent = s.marca;
  $("modalAddress").textContent = [s.direccion, s.municipio, s.provincia].filter(Boolean).join(", ");

  const sched = scheduleStatus(s.horario);
  const schedEl = $("modalSchedule");
  schedEl.textContent = sched.text;
  schedEl.className = sched.open === true ? "open" : sched.open === false ? "closed" : "";

  const list = $("modalPrices");
  list.innerHTML = "";
  Object.entries(s.precios).forEach(([key, val]) => {
    if (val === null) return;
    const box = document.createElement("div");
    box.className = "price" + (key === fuel ? " selected" : "");
    const label = document.createElement("span");
    label.textContent = FUEL_NAMES[key];
    const value = document.createElement("b");
    value.innerHTML = priceHtml(val);
    box.append(label, value);
    list.appendChild(box);
  });

  $("btnGoogle").href = `https://www.google.com/maps/search/?api=1&query=${s.lat},${s.lon}`;
  $("btnApple").href = `https://maps.apple.com/?ll=${s.lat},${s.lon}&q=${encodeURIComponent(s.marca)}`;
  $("modal").classList.remove("hidden");
}

function closeModal() {
  $("modal").classList.add("hidden");
}

// ---------- Arranque ----------

fitViewport(); // antes de crear el mapa, para que nazca con el tamaño correcto

map = new maplibregl.Map({
  container: "map",
  style: MAP_STYLE,
  center: [DEFAULT_CENTER.lng, DEFAULT_CENTER.lat],
  zoom: 11,
  dragRotate: false,
  pitchWithRotate: false,
  touchPitch: false,
  maxPitch: 0,
  attributionControl: false // la atribución va como texto en la cabecera
});
map.touchZoomRotate.disableRotation(); // el mapa siempre mira al norte

// En móvil no ponemos botones de zoom: se hace con los dedos
if (!window.matchMedia("(pointer: coarse)").matches) {
  map.addControl(new maplibregl.NavigationControl({ showCompass: false, visualizePitch: false }), "bottom-right");
  map.addControl(new maplibregl.AttributionControl({ compact: true }), "bottom-left");
}

// Por si acaso se gira igualmente (gestos, teclado), lo devolvemos al norte
map.on("rotate", () => {
  if (map.getBearing() !== 0) map.setBearing(0);
});

// Solo mostramos "Buscar en esta zona" cuando el usuario mueve el mapa
map.on("moveend", (e) => {
  if (e.originalEvent) $("searchArea").classList.remove("hidden");
});

map.on("load", () => {
  addAreaLayers();
  refresh();
  locate();
});

// Recalcula el tamaño al girar el móvil o al cambiar la barra del navegador
window.addEventListener("resize", fitViewport);
window.addEventListener("orientationchange", () => setTimeout(fitViewport, 300));
if (window.visualViewport) window.visualViewport.addEventListener("resize", fitViewport);

$("searchArea").addEventListener("click", () => {
  view = { mode: "bounds", center: null };
  $("searchArea").classList.add("hidden");
  refresh();
});

$("cheapBtn").addEventListener("click", () => focusStation(extremeStations.cheap));
$("expBtn").addEventListener("click", () => focusStation(extremeStations.exp));

$("locate").addEventListener("click", locate);
$("retry").addEventListener("click", loadData);
$("modalClose").addEventListener("click", closeModal);
$("modal").addEventListener("click", (e) => {
  if (e.target.id === "modal") closeModal();
});

buildFuelSelect();
loadData();
</script>
