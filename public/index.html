<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Gasolineras cerca de mí</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<style>
:root {
  color-scheme: dark;
  --text: #f5f5f7;
  --muted: rgba(235, 235, 245, 0.6);
  --blue: #0a84ff;
  --green: #30d158;
  --red: #ff453a;
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", system-ui, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  font-family: var(--font);
  color: var(--text);
  background: #000;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}
button, select { font: inherit; color: inherit; }
.hidden { display: none !important; }

#map { position: fixed; inset: 0; }

/* "Liquid glass": cristal translúcido con brillo en los bordes y desenfoque */
.glass {
  background: linear-gradient(135deg, rgba(255, 255, 255, 0.16), rgba(255, 255, 255, 0.05));
  -webkit-backdrop-filter: blur(24px) saturate(180%);
  backdrop-filter: blur(24px) saturate(180%);
  border: 1px solid rgba(255, 255, 255, 0.18);
  box-shadow:
    inset 0 1px 0 rgba(255, 255, 255, 0.35),
    inset 0 -1px 0 rgba(255, 255, 255, 0.06),
    0 12px 40px rgba(0, 0, 0, 0.45);
  border-radius: 28px;
}

.top {
  position: fixed;
  top: max(12px, env(safe-area-inset-top));
  left: 12px;
  right: 12px;
  z-index: 5;
  display: flex;
  flex-direction: column;
  gap: 10px;
  pointer-events: none;
}
.top > * { pointer-events: auto; }

.header {
  padding: 12px 14px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}
.title { font-weight: 700; font-size: 17px; letter-spacing: -0.2px; }
.status { font-size: 12px; color: var(--muted); margin-top: 2px; }

.brand-select {
  border: 0;
  background: rgba(255, 255, 255, 0.12);
  color: var(--text);
  padding: 9px 14px;
  border-radius: 14px;
  font-size: 14px;
  font-weight: 600;
  max-width: 180px;
  outline: none;
  -webkit-appearance: none;
  appearance: none;
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.2);
}
.brand-select option { background: #1c1c1e; color: #f5f5f7; }

.fuels {
  display: flex;
  gap: 6px;
  padding: 8px;
  overflow-x: auto;
  scrollbar-width: none;
  border-radius: 999px;
}
.fuels::-webkit-scrollbar { display: none; }
.chip {
  flex: 0 0 auto;
  border: 0;
  background: rgba(255, 255, 255, 0.1);
  color: var(--text);
  padding: 8px 14px;
  border-radius: 999px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  transition: background 0.2s, color 0.2s;
}
.chip[aria-pressed="true"] { background: var(--blue); color: #fff; }

.pill {
  position: fixed;
  left: 50%;
  bottom: 32px;
  transform: translateX(-50%);
  z-index: 6;
  padding: 13px 22px;
  border-radius: 999px;
  color: #fff;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  white-space: nowrap;
  background: rgba(10, 132, 255, 0.85);
  -webkit-backdrop-filter: blur(24px) saturate(180%);
  backdrop-filter: blur(24px) saturate(180%);
  border: 1px solid rgba(255, 255, 255, 0.25);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.4), 0 12px 30px rgba(0, 0, 0, 0.4);
}

.round {
  position: fixed;
  left: 16px;
  bottom: 32px;
  z-index: 6;
  width: 48px;
  height: 48px;
  border-radius: 50%;
  font-size: 20px;
  color: #fff;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0;
}

/* Cada pin va dentro de un contenedor que MapLibre posiciona; no le ponemos transiciones */
.pin-wrap { width: auto; height: auto; }
.pin {
  border: 1px solid rgba(255, 255, 255, 0.25);
  background: rgba(28, 28, 30, 0.82);
  color: #fff;
  border-radius: 999px;
  padding: 6px 10px;
  font-size: 12px;
  font-weight: 700;
  white-space: nowrap;
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.2), 0 4px 12px rgba(0, 0, 0, 0.4);
  cursor: pointer;
  font-variant-numeric: tabular-nums;
}
.pin.cheap { background: rgba(48, 209, 88, 0.92); border-color: rgba(255, 255, 255, 0.4); }
.pin.exp { background: rgba(255, 69, 58, 0.92); border-color: rgba(255, 255, 255, 0.4); }

.me {
  width: 16px;
  height: 16px;
  border-radius: 50%;
  background: var(--blue);
  border: 3px solid #fff;
  box-shadow: 0 0 0 6px rgba(10, 132, 255, 0.25);
}

.loader {
  position: fixed;
  inset: 0;
  z-index: 20;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(0, 0, 0, 0.35);
}
.loader-card {
  padding: 22px 26px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
  font-size: 14px;
  font-weight: 500;
  text-align: center;
}
.spinner {
  width: 28px;
  height: 28px;
  border: 3px solid rgba(255, 255, 255, 0.2);
  border-top-color: var(--blue);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.retry {
  border: 0;
  background: var(--blue);
  color: #fff;
  padding: 9px 18px;
  border-radius: 999px;
  font-weight: 600;
  cursor: pointer;
}

.modal {
  position: fixed;
  inset: 0;
  z-index: 30;
  background: rgba(0, 0, 0, 0.45);
  display: flex;
  align-items: flex-end;
  justify-content: center;
}
.sheet {
  background: rgba(28, 28, 30, 0.9);
  -webkit-backdrop-filter: blur(30px) saturate(180%);
  backdrop-filter: blur(30px) saturate(180%);
  width: 100%;
  max-width: 480px;
  max-height: 82vh;
  overflow-y: auto;
  border-radius: 28px 28px 0 0;
  padding: 20px;
  border: 1px solid rgba(255, 255, 255, 0.12);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.2);
}
@media (min-width: 640px) {
  .modal { align-items: center; }
  .sheet { border-radius: 28px; }
}
.sheet-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
.sheet-title { font-size: 19px; font-weight: 700; margin: 0; }
.sheet-sub { font-size: 13px; color: var(--muted); margin-top: 4px; }
.close {
  border: 0;
  background: rgba(255, 255, 255, 0.12);
  width: 32px;
  height: 32px;
  border-radius: 50%;
  font-size: 18px;
  line-height: 1;
  cursor: pointer;
  color: var(--muted);
  flex: 0 0 auto;
}
.info {
  margin: 16px 0 12px;
  padding: 13px 14px;
  background: rgba(255, 255, 255, 0.07);
  border-radius: 16px;
  font-size: 13px;
  display: flex;
  justify-content: space-between;
  gap: 12px;
}
.info .label { color: var(--muted); }
#modalSchedule { font-weight: 600; text-align: right; }
#modalSchedule.open { color: var(--green); }
#modalSchedule.closed { color: var(--red); }
.prices-title {
  font-size: 12px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  color: var(--muted);
  margin: 14px 0 8px;
}
.prices { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.price {
  border-radius: 14px;
  padding: 11px 12px;
  background: rgba(255, 255, 255, 0.07);
  font-size: 13px;
  display: flex;
  flex-direction: column;
  gap: 4px;
  color: var(--muted);
}
.price b { font-size: 16px; color: var(--text); font-variant-numeric: tabular-nums; }
.price.selected { background: rgba(10, 132, 255, 0.22); }
.links { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 18px; }
.links a {
  text-align: center;
  text-decoration: none;
  padding: 13px;
  border-radius: 16px;
  font-size: 14px;
  font-weight: 600;
  color: #fff;
  background: var(--blue);
}
.links a.apple { background: rgba(255, 255, 255, 0.14); }
</style>
</head>
<body>

<div id="map"></div>

<div class="top">
  <div class="glass header">
    <div>
      <div class="title">⛽ Gasolineras</div>
      <div class="status" id="status">Buscando tu ubicación…</div>
    </div>
    <select id="brandSelect" class="brand-select" aria-label="Marca">
      <option value="ALL">Todas las marcas</option>
    </select>
  </div>
  <div class="glass fuels" id="fuelChips" role="group" aria-label="Combustible"></div>
</div>

<button id="searchArea" class="glass pill hidden" type="button">Buscar en esta zona</button>
<button id="locate" class="glass round" type="button" aria-label="Centrar en mi ubicación">◎</button>

<div id="loader" class="loader">
  <div class="glass loader-card">
    <div class="spinner" id="spinner"></div>
    <div id="loaderText">Cargando gasolineras…</div>
    <button id="retry" class="retry hidden" type="button">Reintentar</button>
  </div>
</div>

<div id="modal" class="modal hidden">
  <div class="sheet" role="dialog" aria-modal="true">
    <div class="sheet-head">
      <div>
        <h2 class="sheet-title" id="modalTitle"></h2>
        <div class="sheet-sub" id="modalAddress"></div>
      </div>
      <button class="close" id="modalClose" type="button" aria-label="Cerrar">×</button>
    </div>
    <div class="info">
      <span class="label">Horario</span>
      <span id="modalSchedule"></span>
    </div>
    <div class="prices-title">Precios</div>
    <div class="prices" id="modalPrices"></div>
    <div class="links">
      <a id="btnGoogle" href="#" target="_blank" rel="noopener">Google Maps</a>
      <a id="btnApple" class="apple" href="#" target="_blank" rel="noopener">Apple Maps</a>
    </div>
  </div>
</div>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script>
const API_URL = "/api/gasolineras";
const MAP_STYLE = "https://basemaps.cartocdn.com/gl/dark-matter-gl-style/style.json";
const RADIUS_KM = 15;
const MAX_PINS = 300;
const DEFAULT_CENTER = { lat: 40.4168, lng: -3.7038 }; // Madrid

const FUEL_NAMES = {
  gasolina95: "Gasolina 95 E5",
  gasolina98: "Gasolina 98 E5",
  gasoleoA: "Gasóleo A",
  gasoleoPremium: "Gasóleo Premium",
  glp: "GLP",
  gnc: "GNC"
};

// Marcas que se muestran por separado. Todo lo que no encaje cae en "Otros".
const BRAND_RULES = [
  ["Repsol", ["REPSOL"]],
  ["Moeve / Cepsa", ["MOEVE", "CEPSA", "CAMPSA"]],
  ["Shell", ["SHELL"]],
  ["BP", ["BP"]],
  ["Galp", ["GALP"]],
  ["Ballenoil", ["BALLENOIL"]],
  ["Plenergy", ["PLENERGY"]],
  ["Petronor", ["PETRONOR"]],
  ["Carrefour", ["CARREFOUR"]],
  ["Avia", ["AVIA"]],
  ["Q8", ["Q8"]],
  ["Alcampo", ["ALCAMPO"]],
  ["Eroski", ["EROSKI"]],
  ["E.Leclerc", ["E.LECLERC", "LECLERC"]],
  ["Tamoil", ["TAMOIL"]],
  ["Disa", ["DISA"]],
  ["Naturgy", ["NATURGY"]]
];
const OTHERS = "Otros";

const DAY_IDX = { L: 0, M: 1, X: 2, J: 3, V: 4, S: 5, D: 6 };
const DAY_NAMES = ["lunes", "martes", "miércoles", "jueves", "viernes", "sábado", "domingo"];

let map;
let stations = [];       // estaciones con marca normalizada
let updatedAt = null;
let fuel = "gasolina95";
let brandFilter = "ALL";
let userLoc = null;      // { lat, lng }
let view = { mode: "radius", center: null }; // "radius" o "bounds"
let markers = [];
let userMarker = null;

const $ = (id) => document.getElementById(id);

// ---------- Utilidades ----------

function distKm(lat1, lon1, lat2, lon2) {
  const R = 6371;
  const toRad = (d) => (d * Math.PI) / 180;
  const dLat = toRad(lat2 - lat1);
  const dLon = toRad(lon2 - lon1);
  const a = Math.sin(dLat / 2) ** 2 +
    Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLon / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(a));
}

function fmtPrice(p) {
  return p.toFixed(3).replace(".", ",") + " €";
}

function formatUpdated(iso) {
  if (!iso) return "";
  return new Date(iso).toLocaleString("es-ES", {
    day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit"
  });
}

function normalizeBrand(raw) {
  const t = (raw || "").trim().toUpperCase().replace(/\s+/g, " ");
  for (const [name, keys] of BRAND_RULES) {
    for (const k of keys) {
      if (t === k || t.startsWith(k + " ") || t.startsWith(k + "-") || t.startsWith(k + ".")) return name;
    }
  }
  return OTHERS;
}

function setStatus(text) {
  $("status").textContent = text;
}

// ---------- Horarios ----------

function hhmm(m) {
  return String(Math.floor(m / 60)).padStart(2, "0") + ":" + String(m % 60).padStart(2, "0");
}

function expandDays(str) {
  const set = new Set();
  for (const tok of str.split(",")) {
    const [a, b] = tok.split("-");
    const start = DAY_IDX[a];
    const end = b ? DAY_IDX[b] : start;
    for (let d = start; ; d = (d + 1) % 7) {
      set.add(d);
      if (d === end) break;
    }
  }
  return set;
}

function parseSchedule(h) {
  if (!h) return null;
  const segs = [];
  for (const part of h.split(";")) {
    const m = part.trim().match(/^([LMXJVSD](?:-[LMXJVSD])?(?:,[LMXJVSD](?:-[LMXJVSD])?)*)\s*:\s*(.+)$/);
    if (!m) return null;
    const days = expandDays(m[1]);
    const times = m[2].trim();
    if (/24\s*H/i.test(times)) { segs.push({ days, all: true }); continue; }
    const tm = times.match(/^(\d{1,2}):(\d{2})\s*-\s*(\d{1,2}):(\d{2})$/);
    if (!tm) return null;
    const start = Number(tm[1]) * 60 + Number(tm[2]);
    let end = Number(tm[3]) * 60 + Number(tm[4]);
    if (end === 0) end = 1440; // "hasta las 00:00" = medianoche
    segs.push({ days, start, end });
  }
  return segs;
}

// Hora actual en Madrid: día de la semana (0 = lunes) y minutos desde las 00:00
function madridNow() {
  const parts = new Intl.DateTimeFormat("en-GB", {
    timeZone: "Europe/Madrid", weekday: "short", hour: "2-digit", minute: "2-digit", hour12: false
  }).formatToParts(new Date());
  const get = (type) => parts.find((p) => p.type === type).value;
  const dow = { Mon: 0, Tue: 1, Wed: 2, Thu: 3, Fri: 4, Sat: 5, Sun: 6 }[get("weekday")];
  return { dow, min: (Number(get("hour")) % 24) * 60 + Number(get("minute")) };
}

function scheduleStatus(h) {
  const segs = parseSchedule(h);
  if (!segs) return { open: null, text: h || "Sin datos" };
  const now = madridNow();

  // ¿Está abierto ahora? Miramos hoy y también el turno de ayer que cruza la medianoche
  for (const off of [0, -1]) {
    const dow = (now.dow + off + 7) % 7;
    const t = now.min - off * 1440;
    for (const seg of segs) {
      if (!seg.days.has(dow)) continue;
      if (seg.all) return { open: true, text: "Abierto 24 horas" };
      let s = seg.start;
      let e = seg.end;
      if (e <= s) e += 1440;
      if (t >= s && t < e) return { open: true, text: `Abierto · cierra a las ${hhmm(e % 1440)}` };
    }
  }

  // Cerrado: buscamos el próximo turno de apertura
  for (let k = 0; k <= 7; k++) {
    const dow = (now.dow + k) % 7;
    let best = null;
    for (const seg of segs) {
      if (!seg.days.has(dow) || seg.all) continue;
      const abs = k * 1440 + seg.start;
      if (abs > now.min && (best === null || abs < best.abs)) best = { abs, start: seg.start };
    }
    if (best) {
      const when = k === 0 ? "hoy" : k === 1 ? "mañana" : "el " + DAY_NAMES[dow];
      return { open: false, text: `Cerrado · abre ${when} a las ${hhmm(best.start)}` };
    }
  }
  return { open: false, text: "Cerrado" };
}

// ---------- Filtros ----------

function buildFuelChips() {
  const box = $("fuelChips");
  box.innerHTML = "";
  Object.entries(FUEL_NAMES).forEach(([key, label]) => {
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "chip";
    btn.textContent = label;
    btn.setAttribute("aria-pressed", String(key === fuel));
    btn.addEventListener("click", () => {
      fuel = key;
      document.querySelectorAll(".chip").forEach((c) => c.setAttribute("aria-pressed", String(c === btn)));
      refresh();
    });
    box.appendChild(btn);
  });
}

function buildBrandSelect() {
  const present = new Set(stations.map((s) => s.marca));
  const select = $("brandSelect");
  select.innerHTML = '<option value="ALL">Todas las marcas</option>';
  const names = BRAND_RULES.map(([name]) => name).concat(OTHERS);
  names.filter((name) => present.has(name)).forEach((name) => {
    const opt = document.createElement("option");
    opt.value = name;
    opt.textContent = name;
    select.appendChild(opt);
  });
  select.addEventListener("change", () => {
    brandFilter = select.value;
    refresh();
  });
}

// ---------- Filtrado y pintado ----------

function candidates() {
  return stations.filter((s) =>
    s.precios[fuel] !== null && (brandFilter === "ALL" || s.marca === brandFilter)
  );
}

function stationsNear(center, km) {
  return candidates()
    .map((s) => ({ s, d: distKm(center.lat, center.lng, s.lat, s.lon) }))
    .filter((x) => x.d <= km)
    .sort((a, b) => a.d - b.d);
}

function stationsInView() {
  const bounds = map.getBounds();
  const c = map.getCenter();
  return candidates()
    .filter((s) => bounds.contains([s.lon, s.lat]))
    .map((s) => ({ s, d: distKm(c.lat, c.lng, s.lat, s.lon) }))
    .sort((a, b) => a.d - b.d);
}

function clearMarkers() {
  markers.forEach((m) => m.remove());
  markers = [];
}

function makePin(station, price, cls) {
  const wrap = document.createElement("div");
  wrap.className = "pin-wrap";
  const btn = document.createElement("button");
  btn.type = "button";
  btn.className = "pin " + cls;
  btn.textContent = fmtPrice(price);
  btn.setAttribute("aria-label", `${station.marca}, ${fmtPrice(price)}`);
  btn.addEventListener("click", (e) => {
    e.stopPropagation();
    openModal(station);
  });
  wrap.appendChild(btn);
  return wrap;
}

function renderEntries(entries) {
  clearMarkers();
  const shown = entries.slice(0, MAX_PINS);
  const prices = shown.map((x) => x.s.precios[fuel]);
  const min = prices.length ? Math.min(...prices) : null;
  const max = prices.length ? Math.max(...prices) : null;

  shown.forEach(({ s }) => {
    const price = s.precios[fuel];
    let cls = "";
    if (price === min) cls = "cheap";
    else if (price === max && max !== min) cls = "exp";
    const el = makePin(s, price, cls);
    markers.push(
      new maplibregl.Marker({ element: el, anchor: "center" })
        .setLngLat([s.lon, s.lat])
        .addTo(map)
    );
  });

  const total = entries.length;
  const parts = [total === 0 ? "Sin estaciones aquí" : `${total} estaciones`];
  if (total > MAX_PINS) parts.push(`mostrando ${MAX_PINS} más cercanas`);
  if (updatedAt) parts.push(`precios del ${formatUpdated(updatedAt)}`);
  setStatus(parts.join(" · "));
}

function refresh() {
  if (!stations.length) return;
  let entries;
  if (view.mode === "radius" && view.center) {
    entries = stationsNear(view.center, RADIUS_KM);
    drawArea(circlePolygon(view.center.lat, view.center.lng, RADIUS_KM));
  } else {
    entries = stationsInView();
    drawArea(viewPolygon());
  }
  renderEntries(entries);
}

// ---------- Área de búsqueda ----------

function circlePolygon(lat, lng, km, steps = 96) {
  const R = 6371;
  const d = km / R;
  const lat1 = (lat * Math.PI) / 180;
  const lon1 = (lng * Math.PI) / 180;
  const coords = [];
  for (let i = 0; i <= steps; i++) {
    const brng = (2 * Math.PI * i) / steps;
    const lat2 = Math.asin(Math.sin(lat1) * Math.cos(d) + Math.cos(lat1) * Math.sin(d) * Math.cos(brng));
    const lon2 = lon1 + Math.atan2(
      Math.sin(brng) * Math.sin(d) * Math.cos(lat1),
      Math.cos(d) - Math.sin(lat1) * Math.sin(lat2)
    );
    coords.push([(lon2 * 180) / Math.PI, (lat2 * 180) / Math.PI]);
  }
  return { type: "Feature", properties: {}, geometry: { type: "Polygon", coordinates: [coords] } };
}

function viewPolygon() {
  const b = map.getBounds();
  const w = b.getWest(), e = b.getEast(), s = b.getSouth(), n = b.getNorth();
  return {
    type: "Feature",
    properties: {},
    geometry: { type: "Polygon", coordinates: [[[w, s], [e, s], [e, n], [w, n], [w, s]]] }
  };
}

function drawArea(feature) {
  const src = map && map.getSource("area");
  if (!src) return;
  src.setData({ type: "FeatureCollection", features: feature ? [feature] : [] });
}

function addAreaLayers() {
  map.addSource("area", { type: "geojson", data: { type: "FeatureCollection", features: [] } });
  map.addLayer({
    id: "area-fill",
    type: "fill",
    source: "area",
    paint: { "fill-color": "#0a84ff", "fill-opacity": 0.08 }
  });
  map.addLayer({
    id: "area-line",
    type: "line",
    source: "area",
    paint: { "line-color": "#0a84ff", "line-width": 1.5, "line-opacity": 0.9, "line-dasharray": [2, 2] }
  });
}

// ---------- Ubicación ----------

function showUser(loc) {
  if (userMarker) userMarker.remove();
  const el = document.createElement("div");
  el.className = "pin-wrap";
  const dot = document.createElement("div");
  dot.className = "me";
  el.appendChild(dot);
  userMarker = new maplibregl.Marker({ element: el }).setLngLat([loc.lng, loc.lat]).addTo(map);
}

function goToUser(loc, zoom = 12) {
  userLoc = loc;
  view = { mode: "radius", center: loc };
  showUser(loc);
  $("searchArea").classList.add("hidden");
  map.flyTo({ center: [loc.lng, loc.lat], zoom });
  refresh();
}

function locate() {
  if (!navigator.geolocation) {
    setStatus("Tu navegador no permite la ubicación: mostrando Madrid");
    goToUser(DEFAULT_CENTER);
    return;
  }
  setStatus("Buscando tu ubicación…");
  navigator.geolocation.getCurrentPosition(
    (pos) => goToUser({ lat: pos.coords.latitude, lng: pos.coords.longitude }),
    () => {
      setStatus("Ubicación no disponible: mostrando Madrid");
      goToUser(DEFAULT_CENTER);
    },
    { enableHighAccuracy: true, timeout: 10000, maximumAge: 300000 }
  );
}

// ---------- Carga de datos ----------

function showLoader(text, isError = false) {
  $("loader").classList.remove("hidden");
  $("loaderText").textContent = text;
  $("spinner").classList.toggle("hidden", isError);
  $("retry").classList.toggle("hidden", !isError);
}

function hideLoader() {
  $("loader").classList.add("hidden");
}

async function loadData() {
  showLoader("Cargando gasolineras…");
  try {
    const res = await fetch(API_URL);
    if (!res.ok) throw new Error("HTTP " + res.status);
    const json = await res.json();
    stations = json.estaciones.map((s) => ({ ...s, marca: normalizeBrand(s.rotulo) }));
    updatedAt = json.fechaActualizacion;
    buildBrandSelect();
    hideLoader();
    refresh();
  } catch (err) {
    showLoader("No se pudieron cargar las gasolineras. Inténtalo de nuevo.", true);
  }
}

// ---------- Detalle ----------

function openModal(s) {
  $("modalTitle").textContent = s.marca;
  $("modalAddress").textContent = [s.direccion, s.municipio, s.provincia].filter(Boolean).join(", ");

  const sched = scheduleStatus(s.horario);
  const schedEl = $("modalSchedule");
  schedEl.textContent = sched.text;
  schedEl.className = sched.open === true ? "open" : sched.open === false ? "closed" : "";

  const list = $("modalPrices");
  list.innerHTML = "";
  Object.entries(s.precios).forEach(([key, val]) => {
    if (val === null) return;
    const box = document.createElement("div");
    box.className = "price" + (key === fuel ? " selected" : "");
    const label = document.createElement("span");
    label.textContent = FUEL_NAMES[key];
    const value = document.createElement("b");
    value.textContent = fmtPrice(val);
    box.append(label, value);
    list.appendChild(box);
  });

  $("btnGoogle").href = `https://www.google.com/maps/search/?api=1&query=${s.lat},${s.lon}`;
  $("btnApple").href = `https://maps.apple.com/?ll=${s.lat},${s.lon}&q=${encodeURIComponent(s.marca)}`;
  $("modal").classList.remove("hidden");
}

function closeModal() {
  $("modal").classList.add("hidden");
}

// ---------- Arranque ----------

map = new maplibregl.Map({
  container: "map",
  style: MAP_STYLE,
  center: [DEFAULT_CENTER.lng, DEFAULT_CENTER.lat],
  zoom: 11,
  dragRotate: false,
  pitchWithRotate: false,
  touchPitch: false,
  maxPitch: 0,
  attributionControl: { compact: true }
});
map.touchZoomRotate.disableRotation(); // el mapa siempre mira al norte
map.addControl(new maplibregl.NavigationControl({ showCompass: false, visualizePitch: false }), "bottom-right");

// Por si acaso se gira igualmente (gestos, teclado), lo devolvemos al norte
map.on("rotate", () => {
  if (map.getBearing() !== 0) map.setBearing(0);
});

// Solo mostramos "Buscar en esta zona" cuando el usuario mueve el mapa
map.on("moveend", (e) => {
  if (e.originalEvent) $("searchArea").classList.remove("hidden");
});

map.on("load", () => {
  addAreaLayers();
  refresh();
  locate();
});

$("searchArea").addEventListener("click", () => {
  view = { mode: "bounds", center: null };
  $("searchArea").classList.add("hidden");
  refresh();
});

$("locate").addEventListener("click", locate);
$("retry").addEventListener("click", loadData);
$("modalClose").addEventListener("click", closeModal);
$("modal").addEventListener("click", (e) => {
  if (e.target.id === "modal") closeModal();
});

buildFuelChips();
loadData();
</script>
</body>
</html>
