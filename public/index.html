<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Gasolineras cerca de mí</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<style>
:root {
  color-scheme: light;
  --bg: #f2f2f7;
  --card: rgba(255, 255, 255, 0.8);
  --text: #1c1c1e;
  --muted: #8e8e93;
  --blue: #007aff;
  --green: #34c759;
  --shadow: 0 8px 30px rgba(0, 0, 0, 0.12);
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", system-ui, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  font-family: var(--font);
  color: var(--text);
  background: var(--bg);
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}
button, select { font: inherit; }
.hidden { display: none !important; }

#map { position: fixed; inset: 0; }

.glass {
  background: var(--card);
  -webkit-backdrop-filter: saturate(180%) blur(20px);
  backdrop-filter: saturate(180%) blur(20px);
  border-radius: 18px;
  box-shadow: var(--shadow);
}

.top {
  position: fixed;
  top: max(12px, env(safe-area-inset-top));
  left: 12px;
  right: 12px;
  z-index: 5;
  display: flex;
  flex-direction: column;
  gap: 10px;
  pointer-events: none;
}
.top > * { pointer-events: auto; }

.header {
  padding: 12px 14px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}
.title { font-weight: 700; font-size: 17px; letter-spacing: -0.2px; }
.status { font-size: 12px; color: var(--muted); margin-top: 2px; }
.brand-select {
  border: 0;
  background: rgba(118, 118, 128, 0.12);
  color: var(--text);
  padding: 8px 12px;
  border-radius: 12px;
  font-size: 14px;
  font-weight: 600;
  max-width: 170px;
  outline: none;
}

.fuels {
  display: flex;
  gap: 6px;
  padding: 8px;
  overflow-x: auto;
  scrollbar-width: none;
}
.fuels::-webkit-scrollbar { display: none; }
.chip {
  flex: 0 0 auto;
  border: 0;
  background: rgba(118, 118, 128, 0.12);
  color: var(--text);
  padding: 7px 13px;
  border-radius: 999px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  transition: background 0.2s, color 0.2s;
}
.chip[aria-pressed="true"] { background: var(--blue); color: #fff; }

.pill {
  position: fixed;
  left: 50%;
  bottom: 32px;
  transform: translateX(-50%);
  z-index: 6;
  border: 0;
  padding: 12px 20px;
  border-radius: 999px;
  color: var(--blue);
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  white-space: nowrap;
}

.round {
  position: fixed;
  left: 16px;
  bottom: 32px;
  z-index: 6;
  width: 46px;
  height: 46px;
  border: 0;
  border-radius: 50%;
  font-size: 20px;
  color: var(--blue);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
}

.pin {
  background: #fff;
  color: var(--text);
  border: 0;
  border-radius: 999px;
  padding: 6px 10px;
  font-size: 12px;
  font-weight: 700;
  white-space: nowrap;
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.18);
  cursor: pointer;
  transition: transform 0.15s;
}
.pin:hover { transform: scale(1.06); }
.pin.cheap { background: var(--green); color: #fff; }

.me {
  width: 16px;
  height: 16px;
  border-radius: 50%;
  background: var(--blue);
  border: 3px solid #fff;
  box-shadow: 0 0 0 6px rgba(0, 122, 255, 0.2);
}

.loader {
  position: fixed;
  inset: 0;
  z-index: 20;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(242, 242, 247, 0.5);
}
.loader-card {
  padding: 22px 26px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
  font-size: 14px;
  font-weight: 500;
  text-align: center;
}
.spinner {
  width: 28px;
  height: 28px;
  border: 3px solid rgba(0, 122, 255, 0.2);
  border-top-color: var(--blue);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.retry {
  border: 0;
  background: var(--blue);
  color: #fff;
  padding: 8px 16px;
  border-radius: 999px;
  font-weight: 600;
  cursor: pointer;
}

.modal {
  position: fixed;
  inset: 0;
  z-index: 30;
  background: rgba(0, 0, 0, 0.3);
  display: flex;
  align-items: flex-end;
  justify-content: center;
}
.sheet {
  background: #fff;
  width: 100%;
  max-width: 480px;
  max-height: 80vh;
  overflow-y: auto;
  border-radius: 20px 20px 0 0;
  padding: 20px;
  box-shadow: var(--shadow);
}
@media (min-width: 640px) {
  .modal { align-items: center; }
  .sheet { border-radius: 20px; }
}
.sheet-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
.sheet-title { font-size: 18px; font-weight: 700; margin: 0; }
.sheet-sub { font-size: 13px; color: var(--muted); margin-top: 4px; }
.close {
  border: 0;
  background: rgba(118, 118, 128, 0.12);
  width: 30px;
  height: 30px;
  border-radius: 50%;
  font-size: 18px;
  line-height: 1;
  cursor: pointer;
  color: var(--muted);
}
.info {
  margin: 16px 0 12px;
  padding: 12px 14px;
  background: #f2f2f7;
  border-radius: 14px;
  font-size: 13px;
  display: flex;
  justify-content: space-between;
  gap: 12px;
}
.info span:last-child { color: var(--muted); text-align: right; }
.prices-title {
  font-size: 12px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  color: var(--muted);
  margin: 14px 0 8px;
}
.prices { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.price {
  border-radius: 12px;
  padding: 10px 12px;
  background: #f2f2f7;
  font-size: 13px;
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.price b { font-size: 15px; font-variant-numeric: tabular-nums; }
.price.selected { background: rgba(0, 122, 255, 0.12); color: var(--blue); }
.links { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 18px; }
.links a {
  text-align: center;
  text-decoration: none;
  padding: 12px;
  border-radius: 14px;
  font-size: 14px;
  font-weight: 600;
  color: #fff;
  background: var(--blue);
}
.links a.apple { background: #1c1c1e; }
</style>
</head>
<body>

<div id="map"></div>

<div class="top">
  <div class="glass header">
    <div>
      <div class="title">⛽ Gasolineras</div>
      <div class="status" id="status">Buscando tu ubicación…</div>
    </div>
    <select id="brandSelect" class="brand-select" aria-label="Marca">
      <option value="ALL">Todas</option>
    </select>
  </div>
  <div class="glass fuels" id="fuelChips" role="group" aria-label="Combustible"></div>
</div>

<button id="searchArea" class="glass pill hidden" type="button">Buscar en esta zona</button>
<button id="locate" class="glass round" type="button" aria-label="Centrar en mi ubicación">◎</button>

<div id="loader" class="loader">
  <div class="glass loader-card">
    <div class="spinner" id="spinner"></div>
    <div id="loaderText">Cargando gasolineras…</div>
    <button id="retry" class="retry hidden" type="button">Reintentar</button>
  </div>
</div>

<div id="modal" class="modal hidden">
  <div class="sheet" role="dialog" aria-modal="true">
    <div class="sheet-head">
      <div>
        <h2 class="sheet-title" id="modalTitle"></h2>
        <div class="sheet-sub" id="modalAddress"></div>
      </div>
      <button class="close" id="modalClose" type="button" aria-label="Cerrar">×</button>
    </div>
    <div class="info">
      <span>Horario</span>
      <span id="modalSchedule"></span>
    </div>
    <div class="prices-title">Precios</div>
    <div class="prices" id="modalPrices"></div>
    <div class="links">
      <a id="btnGoogle" href="#" target="_blank" rel="noopener">Google Maps</a>
      <a id="btnApple" class="apple" href="#" target="_blank" rel="noopener">Apple Maps</a>
    </div>
  </div>
</div>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script>
const API_URL = "/api/gasolineras";
const MAP_STYLE = "https://tiles.openfreemap.org/styles/positron";
const RADIUS_KM = 15;
const MAX_PINS = 300;
const DEFAULT_CENTER = { lat: 40.4168, lng: -3.7038 }; // Madrid

const FUEL_NAMES = {
  gasolina95: "Gasolina 95 E5",
  gasolina98: "Gasolina 98 E5",
  gasoleoA: "Gasóleo A",
  gasoleoPremium: "Gasóleo Premium",
  glp: "GLP",
  gnc: "GNC"
};

// Marcas conocidas: si el rótulo empieza por una de ellas, se agrupa bajo ese nombre
const KNOWN_BRANDS = [
  "REPSOL", "CEPSA", "MOEVE", "BP", "SHELL", "GALP", "PLENOIL", "BALLENOIL",
  "PETRONOR", "AVIA", "Q8", "CARREFOUR", "ALCAMPO", "E.LECLERC", "AUCHAN",
  "EROSKI", "DISA", "TAMOIL", "NATURGY"
];

let map;
let stations = [];       // estaciones con marca normalizada
let updatedAt = null;
let fuel = "gasolina95";
let brandFilter = "ALL";
let userLoc = null;      // { lat, lng }
let view = { mode: "radius", center: null }; // "radius" o "bounds"
let markers = [];
let userMarker = null;

const $ = (id) => document.getElementById(id);

// ---------- Utilidades ----------

function distKm(lat1, lon1, lat2, lon2) {
  const R = 6371;
  const toRad = (d) => (d * Math.PI) / 180;
  const dLat = toRad(lat2 - lat1);
  const dLon = toRad(lon2 - lon1);
  const a = Math.sin(dLat / 2) ** 2 +
    Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLon / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(a));
}

function fmtPrice(p) {
  return p.toFixed(3).replace(".", ",") + " €";
}

function prettify(s) {
  if (s.length <= 2) return s;
  return s.toLowerCase().replace(/(^|[\s.\-])(\p{L})/gu, (m, a, b) => a + b.toUpperCase());
}

function normalizeBrand(raw) {
  const t = (raw || "").trim().toUpperCase();
  if (!t || t === "OTRA" || t.includes("SIN RÓTULO") || t.includes("SIN ROTULO")) return "Sin marca";
  const hit = KNOWN_BRANDS.find((b) => t === b || t.startsWith(b + " ") || t.startsWith(b + "-"));
  return prettify(hit || t);
}

function formatUpdated(iso) {
  if (!iso) return "";
  return new Date(iso).toLocaleString("es-ES", {
    day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit"
  });
}

function setStatus(text) {
  $("status").textContent = text;
}

// ---------- Interfaz de filtros ----------

function buildFuelChips() {
  const box = $("fuelChips");
  box.innerHTML = "";
  Object.entries(FUEL_NAMES).forEach(([key, label]) => {
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "chip";
    btn.textContent = label;
    btn.setAttribute("aria-pressed", String(key === fuel));
    btn.addEventListener("click", () => {
      fuel = key;
      document.querySelectorAll(".chip").forEach((c) => c.setAttribute("aria-pressed", String(c === btn)));
      refresh();
    });
    box.appendChild(btn);
  });
}

function buildBrandSelect() {
  const counts = {};
  stations.forEach((s) => { counts[s.marca] = (counts[s.marca] || 0) + 1; });
  const names = Object.keys(counts).sort((a, b) => {
    if (a === "Sin marca") return 1;
    if (b === "Sin marca") return -1;
    return a.localeCompare(b, "es");
  });
  const select = $("brandSelect");
  select.innerHTML = '<option value="ALL">Todas</option>';
  names.forEach((name) => {
    const opt = document.createElement("option");
    opt.value = name;
    opt.textContent = `${name} (${counts[name]})`;
    select.appendChild(opt);
  });
  select.addEventListener("change", () => {
    brandFilter = select.value;
    refresh();
  });
}

// ---------- Filtrado y pintado ----------

function candidates() {
  return stations.filter((s) =>
    s.precios[fuel] !== null && (brandFilter === "ALL" || s.marca === brandFilter)
  );
}

function stationsNear(center, km) {
  return candidates()
    .map((s) => ({ s, d: distKm(center.lat, center.lng, s.lat, s.lon) }))
    .filter((x) => x.d <= km)
    .sort((a, b) => a.d - b.d);
}

function stationsInView() {
  const bounds = map.getBounds();
  const c = map.getCenter();
  return candidates()
    .filter((s) => bounds.contains([s.lon, s.lat]))
    .map((s) => ({ s, d: distKm(c.lat, c.lng, s.lat, s.lon) }))
    .sort((a, b) => a.d - b.d);
}

function clearMarkers() {
  markers.forEach((m) => m.remove());
  markers = [];
}

function renderEntries(entries) {
  clearMarkers();
  const shown = entries.slice(0, MAX_PINS);
  const prices = shown.map((x) => x.s.precios[fuel]);
  const min = prices.length ? Math.min(...prices) : null;

  shown.forEach(({ s }) => {
    const price = s.precios[fuel];
    const el = document.createElement("button");
    el.type = "button";
    el.className = "pin" + (price === min ? " cheap" : "");
    el.textContent = fmtPrice(price);
    el.setAttribute("aria-label", `${s.marca}, ${fmtPrice(price)}`);
    el.addEventListener("click", (e) => {
      e.stopPropagation();
      openModal(s);
    });
    markers.push(
      new maplibregl.Marker({ element: el, anchor: "center" })
        .setLngLat([s.lon, s.lat])
        .addTo(map)
    );
  });

  const total = entries.length;
  const parts = [];
  parts.push(total === 0 ? "Sin estaciones aquí" : `${total} estaciones`);
  if (total > MAX_PINS) parts.push(`mostrando ${MAX_PINS} más cercanas`);
  if (updatedAt) parts.push(`precios del ${formatUpdated(updatedAt)}`);
  setStatus(parts.join(" · "));
}

function refresh() {
  if (!stations.length) return;
  const entries = view.mode === "radius" && view.center
    ? stationsNear(view.center, RADIUS_KM)
    : stationsInView();
  renderEntries(entries);
}

// ---------- Ubicación ----------

function showUser(loc) {
  if (userMarker) userMarker.remove();
  const el = document.createElement("div");
  el.className = "me";
  userMarker = new maplibregl.Marker({ element: el }).setLngLat([loc.lng, loc.lat]).addTo(map);
}

function goToUser(loc, zoom = 12) {
  userLoc = loc;
  view = { mode: "radius", center: loc };
  showUser(loc);
  $("searchArea").classList.add("hidden");
  map.flyTo({ center: [loc.lng, loc.lat], zoom });
  refresh();
}

function locate() {
  if (!navigator.geolocation) {
    setStatus("Tu navegador no permite la ubicación: mostrando Madrid");
    goToUser(DEFAULT_CENTER);
    return;
  }
  setStatus("Buscando tu ubicación…");
  navigator.geolocation.getCurrentPosition(
    (pos) => goToUser({ lat: pos.coords.latitude, lng: pos.coords.longitude }),
    () => {
      setStatus("Ubicación no disponible: mostrando Madrid");
      goToUser(DEFAULT_CENTER);
    },
    { enableHighAccuracy: true, timeout: 10000, maximumAge: 300000 }
  );
}

// ---------- Carga de datos ----------

function showLoader(text, isError = false) {
  $("loader").classList.remove("hidden");
  $("loaderText").textContent = text;
  $("spinner").classList.toggle("hidden", isError);
  $("retry").classList.toggle("hidden", !isError);
}

function hideLoader() {
  $("loader").classList.add("hidden");
}

async function loadData() {
  showLoader("Cargando gasolineras…");
  try {
    const res = await fetch(API_URL);
    if (!res.ok) throw new Error("HTTP " + res.status);
    const json = await res.json();
    stations = json.estaciones.map((s) => ({ ...s, marca: normalizeBrand(s.rotulo) }));
    updatedAt = json.fechaActualizacion;
    buildBrandSelect();
    hideLoader();
    refresh();
  } catch (err) {
    showLoader("No se pudieron cargar las gasolineras. Inténtalo de nuevo.", true);
  }
}

// ---------- Detalle ----------

function openModal(s) {
  $("modalTitle").textContent = s.marca;
  $("modalAddress").textContent = [s.direccion, s.municipio, s.provincia].filter(Boolean).join(", ");
  $("modalSchedule").textContent = s.horario;

  const list = $("modalPrices");
  list.innerHTML = "";
  Object.entries(s.precios).forEach(([key, val]) => {
    if (val === null) return;
    const box = document.createElement("div");
    box.className = "price" + (key === fuel ? " selected" : "");
    const label = document.createElement("span");
    label.textContent = FUEL_NAMES[key];
    const value = document.createElement("b");
    value.textContent = fmtPrice(val);
    box.append(label, value);
    list.appendChild(box);
  });

  $("btnGoogle").href = `https://www.google.com/maps/search/?api=1&query=${s.lat},${s.lon}`;
  $("btnApple").href = `https://maps.apple.com/?ll=${s.lat},${s.lon}&q=${encodeURIComponent(s.marca)}`;
  $("modal").classList.remove("hidden");
}

function closeModal() {
  $("modal").classList.add("hidden");
}

// ---------- Arranque ----------

map = new maplibregl.Map({
  container: "map",
  style: MAP_STYLE,
  center: [DEFAULT_CENTER.lng, DEFAULT_CENTER.lat],
  zoom: 11,
  attributionControl: { compact: true }
});
map.addControl(new maplibregl.NavigationControl({ showCompass: false }), "bottom-right");

// Solo mostramos "Buscar en esta zona" cuando el usuario mueve el mapa
map.on("moveend", (e) => {
  if (e.originalEvent) $("searchArea").classList.remove("hidden");
});

$("searchArea").addEventListener("click", () => {
  view = { mode: "bounds", center: null };
  $("searchArea").classList.add("hidden");
  refresh();
});

$("locate").addEventListener("click", locate);
$("retry").addEventListener("click", loadData);
$("modalClose").addEventListener("click", closeModal);
$("modal").addEventListener("click", (e) => {
  if (e.target.id === "modal") closeModal();
});

buildFuelChips();
loadData();
map.on("load", locate);
</script>
</body>
</html>
